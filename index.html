<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<title>Kubernetes Simulator - Version Badge UI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:#e2e8f0;
  min-height:100vh;
  padding:20px;
  font-size:18px; /* 👈 TO HƠN */
}

h1{
  text-align:center;
  font-size:32px; /* 👈 TO HƠN */
  margin-bottom:10px
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px;
  font-size:18px; /* 👈 TO HƠN */
}

/* BUTTON */
.panel{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:#2563eb;
  transition:.2s;
  font-size:16px; /* 👈 TO HƠN */
}

button:hover{transform:translateY(-2px)}

/* CLUSTER */
.cluster{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
}

/* NODE */
.node{
  width:180px; /* 👈 TO HƠN */
  min-height:180px;
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border-radius:14px;
  padding:12px;
  text-align:center;
  position:relative;
  cursor:pointer;
  transition:.3s;
  font-size:16px;
}

.node.down{
  background:#1a0d0d;
  border:2px solid #ef4444;
  opacity:.85;
}

.node.updating{border:2px dashed #facc15}

/* VERSION BADGE */
.version{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:13px; /* 👈 TO HƠN */
  font-weight:700;
  margin:8px 0;
}

.v1{background:#1e3a5f;color:#93c5fd}
.v2{background:#14532d;color:#86efac}
.down-tag{background:#450a0a;color:#fca5a5}

/* POD */
.pod{
  width:16px;
  height:16px;
  border-radius:50%;
  display:inline-block;
  margin:3px;
  background:#22c55e;
}

/* LOG 👇 NÂNG CẤP Ở ĐÂY */
.log{
  margin-top:25px;
  background:#0b1220;
  padding:15px;
  border-radius:12px;
  height:300px; /* 👈 QUAN TRỌNG: dài hơn */
  overflow-y:auto;
  font-size:14px; /* 👈 TO HƠN */
  color:#94a3b8;
}

/* FIRE */
.fire-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:none;
}
</style>
</head>

<body>

<h1>☸️ Kubernetes Cluster Simulator</h1>

<div class="subtitle"> Hướng dẫn: Rolling update sẽ nâng version từ v1 → v2. Click node để simulate crash.</div>

<div class="panel">
  <button onclick="fireBtn(this); simulateTraffic()">📈 Tăng Traffic</button>
  <button onclick="fireBtn(this); reduceTraffic()">📉 Giảm Traffic</button>
  <button onclick="fireBtn(this); recoverNodes()">🔧 Khôi phục</button>
  <button onclick="fireBtn(this); rollingUpdate()">🔄 Rolling Update</button>
  <button onclick="fireBtn(this); resetCluster()">♻️ Reset</button>
</div>

<div class="cluster" id="cluster"></div>

<div class="log" id="log"></div>

<script>

let nodes=[];
const fires={};

function log(msg){
  const box=document.getElementById("log");
  const t=new Date().toLocaleTimeString("vi-VN",{hour12:false});
  box.innerHTML+=`[${t}] ${msg}<br>`;
  box.scrollTop=box.scrollHeight;
}

function init(){
  nodes=[
    {id:0,pods:2,status:"up",version:"v1"},
    {id:1,pods:2,status:"up",version:"v1"},
    {id:2,pods:2,status:"up",version:"v1"}
  ];
  render();
  log("Cluster ready");
}

function render(){
  const c=document.getElementById("cluster");
  c.innerHTML="";

  nodes.forEach(n=>{
    const div=document.createElement("div");

    let cls="node";
    if(n.status==="down") cls+=" down";
    if(n.status==="updating") cls+=" updating";

    div.className=cls;

    const pods=n.status==="down"
      ? ""
      : Array(n.pods).fill(`<span class="pod"></span>`).join("");

    let versionUI="";
    if(n.status==="down"){
      versionUI=`<div class="version down-tag">Bị hỏng</div>`;
    }else if(n.version==="v2"){
      versionUI=`<div class="version v2">version 2 · Stable</div>`;
    }else{
      versionUI=`<div class="version v1">version 1 · Running</div>`;
    }

    div.innerHTML=`
      <h3>Node ${n.id}</h3>
      ${versionUI}
      <div style="margin:8px 0">${pods}</div>
      <div>Pods: ${n.pods}</div>
      <canvas class="fire-canvas" id="fire-${n.id}"></canvas>
    `;

    div.onclick=()=>crashNode(n.id);
    c.appendChild(div);
  });
}

function fireBtn(btn){
  btn.classList.add("fire");
  setTimeout(()=>btn.classList.remove("fire"),400);
}

function crashNode(id){
  const n=nodes.find(x=>x.id===id);
  if(!n||n.status==="down") return;

  n.status="down";
  n.pods=0;

  log("💥 Node "+id+" bị hỏng");
  render();
}

function simulateTraffic(){
  nodes.forEach(n=>{ if(n.status!=="down") n.pods+=1; });
  log("📈 Traffic tăng");
  render();
}

function reduceTraffic(){
  nodes.forEach(n=>n.pods=Math.max(1,n.pods-1));
  log("📉 Traffic giảm");
  render();
}

function recoverNodes(){
  nodes.forEach(n=>{
    if(n.status==="down"){
      n.status="up";
      n.pods=2;
    }
  });
  log("🔧 Khôi phục node");
  render();
}

async function rollingUpdate(){
  log("🔄 Rolling Update bắt đầu");

  for(const n of nodes){
    if(n.status==="down"){
      log("Skip Node "+n.id);
      continue;
    }

    n.status="updating";
    render();
    await sleep(700);

    n.pods=0;
    render();
    await sleep(400);

    n.version="v2";
    n.pods=2;
    n.status="up";
    render();
    await sleep(500);
  }

  log("✅ Upgrade hoàn tất lên v2");
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function resetCluster(){
  init();
}

init();

</script>
</body>
</html>
