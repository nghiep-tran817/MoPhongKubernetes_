<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<title>Kubernetes Simulator - Version Badge UI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:#e2e8f0;
  min-height:100vh;
  padding:20px;
}

h1{text-align:center;font-size:22px;margin-bottom:6px}
.subtitle{text-align:center;color:#94a3b8;margin-bottom:16px}

/* BUTTON */
.panel{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  color:white;
  background:#2563eb;
  transition:.2s;
}

button:hover{transform:translateY(-2px)}

button.fire{
  animation:fireBtn .4s ease;
  box-shadow:0 0 12px #f97316,0 0 25px #ef4444;
}

@keyframes fireBtn{
  0%{transform:scale(1)}
  50%{transform:scale(1.08);background:linear-gradient(135deg,#ef4444,#f97316)}
  100%{transform:scale(1)}
}

/* CLUSTER */
.cluster{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:16px;
}

/* NODE */
.node{
  width:150px;
  min-height:150px;
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border-radius:14px;
  padding:10px;
  text-align:center;
  position:relative;
  cursor:pointer;
  transition:.3s;
}

.node.down{
  background:#1a0d0d;
  border:2px solid #ef4444;
  opacity:.85;
}

.node.updating{border:2px dashed #facc15}

/* VERSION BADGE */
.version{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  margin:6px 0;
}

.v1{
  background:#1e3a5f;
  color:#93c5fd;
}

.v2{
  background:#14532d;
  color:#86efac;
}

.down-tag{
  background:#450a0a;
  color:#fca5a5;
}

/* POD */
.pod{
  width:14px;
  height:14px;
  border-radius:50%;
  display:inline-block;
  margin:2px;
  background:#22c55e;
}

/* FIRE */
.fire-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  display:none;
}

/* LOG */
.log{
  margin-top:20px;
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  height:160px;
  overflow-y:auto;
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>

<h1>☸️ Mô phỏng Kubernetes/h1>

<div class="subtitle"> <p>Hướng dẫn sử dụng: Khi nhấn vào rolling update thì các node sẽ chạy sang version 2. Nếu bạn muốn kiểm tra khi một node hỏng thì nhấn node đó -> nút đó chuyển màu và đóng vai trò là nút bị hỏng</p></div>

<div class="panel">
  <button onclick="fireBtn(this); simulateTraffic()">📈 Tăng Traffic</button>
  <button onclick="fireBtn(this); reduceTraffic()">📉 Giảm Traffic</button>
  <button onclick="fireBtn(this); recoverNodes()">🔧 Khôi phục</button>
  <button onclick="fireBtn(this); rollingUpdate()">🔄 Rolling Update</button>
  <button onclick="fireBtn(this); resetCluster()">♻️ Reset</button>
</div>

<div class="cluster" id="cluster"></div>

<div class="log" id="log"></div>

<script>

let nodes=[];
const fires={};

/* LOG */
function log(msg){
  const box=document.getElementById("log");
  const t=new Date().toLocaleTimeString("vi-VN",{hour12:false});
  box.innerHTML+=`[${t}] ${msg}<br>`;
  box.scrollTop=box.scrollHeight;
}

/* INIT */
function init(){
  nodes=[
    {id:0,pods:2,status:"up",version:"version 1"},
    {id:1,pods:2,status:"up",version:"version 1"},
    {id:2,pods:2,status:"up",version:"version 1"}
  ];
  render();
  log("Cluster ready");
}

/* RENDER */
function render(){
  const c=document.getElementById("cluster");
  c.innerHTML="";

  nodes.forEach(n=>{
    const div=document.createElement("div");

    let cls="node";
    if(n.status==="down") cls+=" down";
    if(n.status==="updating") cls+=" updating";

    div.className=cls;

    const pods=n.status==="down"
      ? ""
      : Array(n.pods).fill(`<span class="pod"></span>`).join("");

    /* VERSION BADGE */
    let versionUI="";
    if(n.status==="down"){
      versionUI=`<div class="version down-tag">Bị hỏng</div>`;
    }else if(n.version==="v2"){
      versionUI=`<div class="version v2">version 2 · Stable</div>`;
    }else{
      versionUI=`<div class="version v1">version 1 · Running</div>`;
    }

    div.innerHTML=`
      <h4>Node ${n.id}</h4>
      ${versionUI}
      <div style="margin:6px 0">${pods}</div>
      <div style="font-size:12px">Pods: ${n.pods}</div>

      <canvas class="fire-canvas" id="fire-${n.id}"></canvas>
    `;

    div.onclick=()=>crashNode(n.id);
    c.appendChild(div);

    if(n.status==="down") startFire(n.id);
    else stopFire(n.id);
  });
}

/* BUTTON FIRE EFFECT */
function fireBtn(btn){
  btn.classList.add("fire");
  setTimeout(()=>btn.classList.remove("fire"),400);
}

/* FIRE EFFECT */
function startFire(id){
  const canvas=document.getElementById("fire-"+id);
  if(!canvas) return;

  canvas.style.display="block";
  const ctx=canvas.getContext("2d");
  canvas.width=150;
  canvas.height=150;

  const particles=[];

  function spawn(){
    return{
      x:Math.random()*150,
      y:120+Math.random()*20,
      vx:(Math.random()-0.5)*1,
      vy:-Math.random()*2,
      life:Math.random()
    };
  }

  for(let i=0;i<25;i++)particles.push(spawn());

  fires[id]=setInterval(()=>{
    ctx.clearRect(0,0,150,150);

    particles.forEach(p=>{
      p.x+=p.vx;
      p.y+=p.vy;
      p.life-=0.02;

      if(p.life<=0) Object.assign(p,spawn());

      ctx.beginPath();
      ctx.fillStyle=`rgba(255,${100+Math.random()*100},0,${p.life})`;
      ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fill();
    });
  },30);
}

function stopFire(id){
  if(fires[id]) clearInterval(fires[id]);
  delete fires[id];

  const c=document.getElementById("fire-"+id);
  if(c) c.style.display="none";
}

/* ACTIONS */
function crashNode(id){
  const n=nodes.find(x=>x.id===id);
  if(!n||n.status==="down") return;

  n.status="down";
  n.pods=0;

  log("💥 Node "+id+" bị hỏng");
  render();
}

function simulateTraffic(){
  nodes.forEach(n=>{ if(n.status!=="down") n.pods+=1; });
  log("📈 Traffic tăng");
  render();
}

function reduceTraffic(){
  nodes.forEach(n=>n.pods=Math.max(1,n.pods-1));
  log("📉 Traffic giảm");
  render();
}

function recoverNodes(){
  nodes.forEach(n=>{
    if(n.status==="down"){
      n.status="up";
      n.pods=2;
      stopFire(n.id);
    }
  });
  log("🔧 Khôi phục node");
  render();
}

/* ROLLING UPDATE */
async function rollingUpdate(){
  log("🔄 Rolling Update bắt đầu");

  for(const n of nodes){
    if(n.status==="down"){
      log("Skip Node "+n.id);
      continue;
    }

    n.status="updating";
    render();
    await sleep(700);

    n.pods=0;
    render();
    await sleep(500);

    n.version="v2";
    n.pods=2;
    n.status="up";
    render();
    await sleep(500);
  }
  
  log("Đã cập nhật lên version 2");
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* RESET */
function resetCluster(){
  init();
}

/* INIT */
init();

</script>
</body>
</html>
